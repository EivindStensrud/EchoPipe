name: echopipe-env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Core Python & Package Manager
  - python>=3.11
  - conda=24.5.0
  
  # External Bioinformatics Binaries
  - blast>=2.15.0
  - mafft>=7.525
  - fasttree>=2.1.11
  - entrez-direct>=21.6
  
  # Python Dependencies
  - biopython>=1.83
  - pandas>=2.2.2
  - numpy>=1.26.4
  - matplotlib>=3.9.2
  - tqdm>=4.66.4
  - ete3>=3.1.3
  
  # Package Installer
  - pip
  - pip:
    - .
